name: Build & Release

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Build Android'
        required: true
        default: true
        type: boolean
      build_ios:
        description: 'Build iOS'
        required: true
        default: true
        type: boolean
      build_macos:
        description: 'Build macOS'
        required: true
        default: true
        type: boolean
      build_windows:
        description: 'Build Windows'
        required: true
        default: true
        type: boolean
      build_linux:
        description: 'Build Linux'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Extract Version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create Dummy Assets Dir (no bundled plugins)
        run: mkdir -p assets/plugins/

  create_release:
    name: Create Release
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          bodyFile: "CHANGELOG.md"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}

  shortcode:
    name: Installer Scripts
    needs: [version, create_release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare Installer Scripts
        run: |
          chmod +x installer.sh uninstaller.sh
      - name: Upload Installer Scripts
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.version.outputs.version }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            installer.sh
            uninstaller.sh
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Android Build
    needs: [version, create_release]
    if: ${{ github.event.inputs.build_android == 'true' }}
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # Remove desktop TorrServer binaries to reduce APK size by ~170MB
      # These are only needed for macOS, Windows, and Linux
      - name: Strip Desktop Binaries
        run: rm -f packages/flutter_torrent_server/assets/torrserver/TorrServer-*

      # Generate our own keystore if no ANDROID_KEYSTORE_BASE64 secret is set.
      # The keystore is created fresh per build with a random password.
      - name: Generate Own Keystore
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            KS_PASS="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)"
            keytool -genkeypair -v \
              -keystore android/app/release.jks \
              -alias mixstream -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=MixStream, OU=MixStream, O=MixStream, L=Internet, S=Internet, C=US"
            echo "storePassword=$KS_PASS" > android/key.properties
            echo "keyPassword=$KS_PASS" >> android/key.properties
            echo "keyAlias=mixstream" >> android/key.properties
            echo "storeFile=release.jks" >> android/key.properties
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            echo "storePassword=$ANDROID_STORE_PASSWORD" > android/key.properties
            echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
            echo "storeFile=release.jks" >> android/key.properties
          fi

      - name: Generate dart-defines file
        shell: bash
        run: |
          cat > dart-defines.json << 'JSON_EOF'
          {
            "TMDB_API_KEY": "${{ secrets.TMDB_API_KEY }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "TRAKT_CLIENT_ID": "${{ secrets.TRAKT_CLIENT_ID }}",
            "TRAKT_CLIENT_SECRET": "${{ secrets.TRAKT_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANIMESKIP_CLIENT_ID": "${{ secrets.ANIMESKIP_CLIENT_ID }}"
          }
          JSON_EOF

      - name: Build Split APKs (armeabi-v7a, arm64-v8a, x86_64)
        run: flutter build apk --release --split-per-abi --dart-define-from-file=dart-defines.json

      # x86 (32-bit) was removed from recent Flutter versions.
      # Attempt it anyway; skip gracefully if the toolchain doesn't support it.
      - name: Build x86 APK (best-effort)
        run: |
          flutter build apk --release --target-platform android-x86 --dart-define-from-file=dart-defines.json || echo "WARN: x86 not supported by this Flutter version, skipping"

      - name: Build Universal APK
        run: flutter build apk --release --dart-define-from-file=dart-defines.json

      - name: Rename APKs (MixStream-*)
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          cd build/app/outputs/flutter-apk/

          # Universal Release
          if [ -f "app-release.apk" ]; then
            mv "app-release.apk" "../../../../MixStream-Android-universal-${VERSION}.apk"
          fi

          # Splits
          for f in app-*-release.apk; do
            if [ -f "$f" ]; then
              # Extract ABI: app-<abi>-release.apk -> <abi>
              abi="${f#app-}"
              abi="${abi%-release.apk}"
              mv "$f" "../../../../MixStream-Android-${abi}-${VERSION}.apk"
            fi
          done

      - name: Upload Release Assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.version.outputs.version }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "MixStream-Android-*"
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}

  ios:
    name: iOS Build (Unsigned)
    needs: [version, create_release]
    if: ${{ github.event.inputs.build_ios == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Select Latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Generate dart-defines file
        shell: bash
        run: |
          cat > dart-defines.json << 'JSON_EOF'
          {
            "TMDB_API_KEY": "${{ secrets.TMDB_API_KEY }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "TRAKT_CLIENT_ID": "${{ secrets.TRAKT_CLIENT_ID }}",
            "TRAKT_CLIENT_SECRET": "${{ secrets.TRAKT_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANIMESKIP_CLIENT_ID": "${{ secrets.ANIMESKIP_CLIENT_ID }}"
          }
          JSON_EOF

      - name: Build iOS (No Codesign)
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          flutter build ios --release --no-codesign --dart-define-from-file=dart-defines.json
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r "MixStream-iOS-${VERSION}.ipa" Payload

      - name: Build Xcode Archive (No Codesign)
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            archive
          zip -ry "MixStream-iOS-${VERSION}.xcarchive.zip" build/Runner.xcarchive

      - name: Upload Release Assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.version.outputs.version }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            MixStream-iOS-*
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS Build (${{ matrix.arch }})
    needs: [version, create_release]
    if: ${{ github.event.inputs.build_macos == 'true' }}
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            torrserver_binary: TorrServer-darwin-arm64
            xcode_arch: arm64
          - arch: x64
            torrserver_binary: TorrServer-darwin-amd64
            xcode_arch: x86_64
          - arch: universal
            torrserver_binary: TorrServer-darwin-amd64
            xcode_arch: "arm64 x86_64"
    steps:
      - uses: actions/checkout@v5
      - name: Select Latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # Keep only the required TorrServer binary for this architecture
      - name: Strip Unused Binaries
        run: |
          cd packages/flutter_torrent_server/assets/torrserver
          # For universal builds keep the arm64 binary (works via Rosetta fallback)
          KEEP="${{ matrix.torrserver_binary }}"
          if [ "${{ matrix.arch }}" = "universal" ]; then
            KEEP="TorrServer-darwin-arm64"
          fi
          find . -type f ! -name "$KEEP" -delete

      - name: Generate dart-defines file
        shell: bash
        run: |
          cat > dart-defines.json << 'JSON_EOF'
          {
            "TMDB_API_KEY": "${{ secrets.TMDB_API_KEY }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "TRAKT_CLIENT_ID": "${{ secrets.TRAKT_CLIENT_ID }}",
            "TRAKT_CLIENT_SECRET": "${{ secrets.TRAKT_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANIMESKIP_CLIENT_ID": "${{ secrets.ANIMESKIP_CLIENT_ID }}"
          }
          JSON_EOF

      - name: Build macOS (${{ matrix.arch }})
        run: |
          flutter build macos --release --config-only --dart-define-from-file=dart-defines.json
          cd macos
          xcodebuild -workspace Runner.xcworkspace \
            -configuration Release \
            -scheme Runner \
            -derivedDataPath ../build/macos \
            ARCHS="${{ matrix.xcode_arch }}" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Re-sign all frameworks to fix media_kit MPV crash (Issue #830)
      - name: Re-sign Frameworks
        run: |
          APP_PATH="build/macos/Build/Products/Release/MixStream.app"
          FRAMEWORKS_PATH="$APP_PATH/Contents/Frameworks"

          find "$FRAMEWORKS_PATH" -name "*.framework" -type d | while read framework; do
            codesign --force --deep --sign - "$framework"
          done

          find "$FRAMEWORKS_PATH" -name "*.dylib" -type f | while read dylib; do
            codesign --force --sign - "$dylib"
          done

          codesign --force --deep --sign - "$APP_PATH"

      # CRITICAL: Use -y flag to preserve symlinks! (macOS frameworks)
      - name: Generate DMG
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          cd build/macos/Build/Products/Release

          mkdir -p dmg_temp
          cp -R MixStream.app dmg_temp/
          ln -s /Applications dmg_temp/Applications
          hdiutil create -volname "MixStream" -srcfolder dmg_temp -ov -format UDZO "../../../../../MixStream-macOS-${{ matrix.arch }}-${VERSION}.dmg"

      - name: Upload Release Assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.version.outputs.version }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            MixStream-macOS-${{ matrix.arch }}-*
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows Build
    needs: [version, create_release]
    if: ${{ github.event.inputs.build_windows == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-2022
            arch: x64
            torrserver_binary: TorrServer-windows-amd64.exe
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Dependencies
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # Keep only the Windows TorrServer binary
      - name: Strip Unused Binaries
        shell: pwsh
        run: |
          cd packages/flutter_torrent_server/assets/torrserver
          Get-ChildItem -File | Where-Object { $_.Name -ne "${{ matrix.torrserver_binary }}" } | Remove-Item
          Get-ChildItem

      - name: Download libmpv-2.dll
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          $assetPattern = '^mpv-dev-x86_64-(?!v\d+-)\d{8}-git-[a-f0-9]+\.7z$'

          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -match $assetPattern } | Select-Object -First 1
          if (-not $asset) {
            throw "Could not find matching mpv asset for pattern: $assetPattern"
          }

          $archivePath = Join-Path $env:RUNNER_TEMP 'mpv-dev.7z'
          $extractDir = Join-Path $env:RUNNER_TEMP 'mpv-dev-extract'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archivePath
          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
          & 7z x $archivePath "-o$extractDir" -y | Out-Null

          $dll = Get-ChildItem -Path $extractDir -Filter 'libmpv-2.dll' -Recurse | Select-Object -First 1
          if (-not $dll) {
            throw 'libmpv-2.dll was not found in extracted mpv archive'
          }

          "MIXSTREAM_WINDOWS_MPV_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using downloaded libmpv: $($dll.FullName)"

      - name: Generate dart-defines file
        shell: bash
        run: |
          cat > dart-defines.json << 'JSON_EOF'
          {
            "TMDB_API_KEY": "${{ secrets.TMDB_API_KEY }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "TRAKT_CLIENT_ID": "${{ secrets.TRAKT_CLIENT_ID }}",
            "TRAKT_CLIENT_SECRET": "${{ secrets.TRAKT_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANIMESKIP_CLIENT_ID": "${{ secrets.ANIMESKIP_CLIENT_ID }}"
          }
          JSON_EOF

      - name: Build Windows
        run: flutter build windows --release --dart-define-from-file=dart-defines.json

      # ---- .exe installer (Inno Setup) ----
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Installer (EXE)
        shell: pwsh
        run: |
          $Version = "${{ needs.version.outputs.version }}".TrimStart('v')
          $AppDir = "..\..\..\build\windows\${{ matrix.arch }}\runner\Release"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$Version /DAppArch=${{ matrix.arch }} /DAppDir=$AppDir windows\packaging\exe\setup.iss

      - name: Rename EXE to MixStream-*
        shell: pwsh
        run: |
          $Version = "${{ needs.version.outputs.version }}"
          Get-ChildItem windows\packaging\exe\Output\*.exe | ForEach-Object {
            Move-Item $_.FullName "MixStream-Windows-${{ matrix.arch }}-Setup-${Version}.exe" -Force
          }

      - name: Upload Release Assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.version.outputs.version }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            MixStream-Windows-${{ matrix.arch }}-*
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}

  linux:
    name: Linux Build (${{ matrix.arch }})
    needs: [version, create_release]
    if: ${{ github.event.inputs.build_linux == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            torrserver_binary: TorrServer-linux-amd64
          - os: ubuntu-22.04-arm
            arch: arm64
            torrserver_binary: TorrServer-linux-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        if: ${{ matrix.arch != 'arm64' }}
        with:
          channel: 'stable'
      - name: Setup Flutter (ARM64 Linux)
        if: ${{ matrix.arch == 'arm64' }}
        run: |
          git clone https://github.com/flutter/flutter.git -b stable $RUNNER_TOOL_CACHE/flutter
          echo "$RUNNER_TOOL_CACHE/flutter/bin" >> $GITHUB_PATH
      - name: Install Linux Dependencies
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::ForceIPv4=true update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::ForceIPv4=true install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev libasound2-dev libsecret-1-dev xz-utils rpm

      - name: Install Flutter Dependencies
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # Keep only the Linux TorrServer binary
      - name: Strip Unused Binaries
        run: |
          cd packages/flutter_torrent_server/assets/torrserver
          find . -type f ! -name "${{ matrix.torrserver_binary }}" -delete

      - name: Generate dart-defines file
        shell: bash
        run: |
          cat > dart-defines.json << 'JSON_EOF'
          {
            "TMDB_API_KEY": "${{ secrets.TMDB_API_KEY }}",
            "SIMKL_CLIENT_ID": "${{ secrets.SIMKL_CLIENT_ID }}",
            "SIMKL_CLIENT_SECRET": "${{ secrets.SIMKL_CLIENT_SECRET }}",
            "TRAKT_CLIENT_ID": "${{ secrets.TRAKT_CLIENT_ID }}",
            "TRAKT_CLIENT_SECRET": "${{ secrets.TRAKT_CLIENT_SECRET }}",
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANIMESKIP_CLIENT_ID": "${{ secrets.ANIMESKIP_CLIENT_ID }}"
          }
          JSON_EOF

      - name: Build Linux Bundle
        run: flutter build linux --release --dart-define-from-file=dart-defines.json

      - name: Build .deb / .rpm (fastforge)
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          dart pub global activate fastforge
          fastforge package --platform linux --targets deb,rpm --flutter-build-args=dart-define-from-file=dart-defines.json

      - name: Rename fastforge Packages to MixStream-*
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          for f in dist/*/*.deb; do
            [ -f "$f" ] && mv "$f" "MixStream-Linux-${{ matrix.arch }}-${VERSION}.deb"
          done
          for f in dist/*/*.rpm; do
            [ -f "$f" ] && mv "$f" "MixStream-Linux-${{ matrix.arch }}-${VERSION}.rpm"
          done

      # ---- .tar.xz from the raw bundle ----
      - name: Build tar.xz
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          cd build/linux/${{ matrix.arch }}/release/bundle
          tar -cJvf "../../../../../MixStream-Linux-${{ matrix.arch }}-${VERSION}.tar.xz" .

      - name: Upload Release Assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.version.outputs.version }}
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            MixStream-Linux-${{ matrix.arch }}-*
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
