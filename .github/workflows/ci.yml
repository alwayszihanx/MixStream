# Fast pre-merge gate. The release/preview workflows are workflow_dispatch-only,
# so before this existed nothing at all ran on a pull request and the vendored
# native plugin was first compiled during a manual release build.
#
# WHAT GATES A MERGE, AND WHY IT IS SPLIT THIS WAY
#   Every pull request:  analyze, test, custom_lint, the two vendored Dart
#     packages, the Go torrent server, and a debug build of Android and Linux.
#     All of that is 1x-billed ubuntu and finishes inside ~20 minutes.
#   Pull requests that touch anything a native toolchain compiles or links
#     (packages/**, android/**, ios/**, macos/**, windows/**, linux/**,
#     pubspec.*, this file): also Windows, macOS and iOS. That is the set that
#     covers the vendored video_view C plugin, which is the code most
#     likely to break on one platform only.
#   Push to main, the nightly schedule, and manual dispatch: all five
#     shipping platforms unconditionally, so a break that no path filter could
#     predict - a transitive pub bump, an Xcode or NDK image roll, a CocoaPods
#     release - is caught within a day rather than at the next release build.
# macOS runners bill at 10x and are the slowest; they are the only thing kept
# off the common path. Android and Linux are 1x and run on everything.

name: CI

on:
  pull_request:
  push:
    # main, not master: this repo has never had a master branch, so the old
    # value meant no push ever ran CI at all and only the nightly schedule and
    # manual dispatch did.
    branches: [main]
  schedule:
    # 06:00 UTC daily. Runs the full five-platform matrix.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than floating on `stable`: the analyzer, the lint set and the
  # gen-l10n output all move with the SDK, so an unpinned runner would rewrite
  # the baseline under us and fail a PR that touched nothing.
  FLUTTER_VERSION: 3.47.1

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock', 'packages/*/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      # ffmpeg and ffprobe are the oracle for the MKV remuxer and HLS suites:
      # they generate the fixtures and then verify the output decodes clean.
      # The app itself has no FFmpeg dependency, so this is test-only. Ubuntu's
      # build carries libx264/libx265/libvpx/libopus; the suites pick their
      # encoder from what is present, so this works on either.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      # Two different kinds of generated code, and only one of them is checked
      # in. lib/l10n/generated/** is committed, so gen-l10n here is a drift
      # check (see the next step). *.g.dart is gitignored, so without
      # build_runner the analyzer reports thousands of phantom
      # undefined_identifier errors - it has to run before analyze, not after.
      - name: Install Dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # An ARB edited without re-running gen-l10n ships nothing: the app reads
      # the committed Dart, not the .arb. Cheap to catch, invisible otherwise.
      - name: Check gen-l10n Output Is Committed
        run: |
          if ! git diff --exit-code --stat -- lib/l10n/generated; then
            echo "::error::lib/l10n/generated is stale. Run 'flutter gen-l10n' and commit the result."
            exit 1
          fi

      # gen-l10n wrote the per-locale backlog to build/l10n_untranslated.json
      # (configured in l10n.yaml). Blocking on the founding locales only; the
      # other 39 arrived in one bulk import and warn instead.
      - name: Translation Coverage
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys

          # hi and kn are the only locales the repo has ever treated as
          # first-class: they were hand-authored alongside en across three
          # commits before the other 39 landed in a single bulk import, and
          # they still carry the fewest values left verbatim in English.
          TOP_TIER = {'hi', 'kn'}
          # Every locale is short the same 62 keys from the player migration.
          # The ratchet may fall, never rise; drop it as translations land.
          BACKLOG = 62

          report = pathlib.Path('build/l10n_untranslated.json')
          if not report.exists():
              sys.exit('::error::gen-l10n wrote no untranslated report; check untranslated-messages-file in l10n.yaml')

          missing = {loc: set(keys) for loc, keys in json.loads(report.read_text()).items()}
          if not missing:
              print('Every locale is complete.')
              sys.exit(0)

          # A key that some other locale has already translated is not part of
          # the shared backlog - it is a top-tier locale falling behind, which
          # is the case worth blocking a merge over.
          shared = set.intersection(*missing.values())
          behind = set().union(*missing.values()) - shared

          failures = []
          for loc in sorted(TOP_TIER):
              keys = missing.get(loc, set())
              lagging = sorted(keys & behind)
              if lagging:
                  failures.append(f'{loc} is missing {len(lagging)} key(s) other locales already have: {", ".join(lagging[:10])}')
              if len(keys) > BACKLOG:
                  failures.append(f'{loc} is missing {len(keys)} keys, above the {BACKLOG} the backlog ratchet allows')

          for loc in sorted(missing, key=lambda l: (-len(missing[l]), l)):
              tier = 'BLOCKING' if loc in TOP_TIER else 'warn'
              line = f'{loc}: {len(missing[loc])} untranslated ({tier})'
              print(line)
              if loc not in TOP_TIER:
                  print(f'::warning::{line}')

          if failures:
              for f in failures:
                  print(f'::error::{f}')
              sys.exit(1)
          PY

      # Errors and warnings gate the merge; infos do not. This SDK defaults
      # --fatal-infos on, and analysis_options.yaml documents the lint backlog
      # as something to work off incrementally (see the discarded_futures
      # note), so 50-odd style infos would otherwise hold every PR. They are
      # still printed, and `dart run custom_lint` below is unchanged.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # `flutter analyze` does not run the riverpod_lint rule set at all - the
      # analyzer's own `plugins:` key for it is deprecated and no longer set,
      # so outside an IDE those rules would never execute. This is the command
      # that runs them (all 15 riverpod_lint 3.1.0 rules are on by default);
      # it takes seconds.
      - name: Custom Lint
        run: dart run custom_lint

      # The extension-engine tests drive QuickJS over FFI, and under
      # FLUTTER_TEST the vendored fork resolves it per platform: macOS reads
      # the symbols out of the test process, Linux opens a real .so named by
      # LIBQUICKJSC_TEST_PATH. Nothing in a host test run builds that .so - it
      # is normally produced by a Linux *app* build - so without this step
      # every FFI test fails with "cannot open shared object file", and the
      # plugin-sandbox tests that fail are the ones asserting one extension
      # cannot harvest another's token.
      #
      # Built directly rather than through packages/flutter_js_ng/linux, whose
      # CMake target links flutter and GTK to be a plugin. The FFI needs only
      # the bridge and QuickJS itself, so this is the same source list with the
      # plugin wrapper dropped, and it needs no Flutter artifacts. The .c files
      # are compiled as C and the bridge as C++, which is what that CMakeLists
      # does via `project(... LANGUAGES CXX C)`.
      - name: Build QuickJS Test Bridge
        run: |
          set -euo pipefail
          cd packages/flutter_js_ng
          out="$RUNNER_TEMP/qjs"
          mkdir -p "$out"
          defs='-DCONFIG_VERSION="2024-01-01" -DQUICKJS -DCONFIG_BIGNUM -D_GNU_SOURCE'
          for f in cutils libregexp libunicode libbf quickjs; do
            gcc -c -fPIC -O1 -funsigned-char -Wno-unused-but-set-variable \
              $defs -Icxx/quickjs -o "$out/$f.o" "cxx/quickjs/$f.c"
          done
          g++ -c -fPIC -O1 -std=c++17 $defs -Icxx/quickjs -Icxx \
            -o "$out/bridge.o" cxx/libfastdev_quickjs_runtime.cpp
          g++ -shared -o "$out/libquickjs_c_bridge_plugin.so" "$out"/*.o -lm -ldl -lpthread
          # Fail here rather than as a confusing FFI error inside the suite.
          nm -D --defined-only "$out/libquickjs_c_bridge_plugin.so" | grep -q ' jsNewRuntime$'
          echo "LIBQUICKJSC_TEST_PATH=$out/libquickjs_c_bridge_plugin.so" >> "$GITHUB_ENV"

      - name: Test
        run: flutter test

  # The vendored Dart packages, in parallel with the app suite rather than
  # appended to it. Each is a path dependency, so it needs its own
  # package_config; the root analysis_options excludes packages/**, so this job
  # is the only place any of them is analysed. None has generated code, so none
  # needs a build_runner step.
  #
  # vlc_player was in this matrix until the mpv-based video_view replaced it;
  # the directory is gone, so the leg could only ever fail on the missing
  # working directory. Its native side is now covered by video_view, which the
  # build matrix below compiles on every platform that has a toolchain.
  #
  # packages/flutter_js_ng is deliberately NOT here, and that is a known gap:
  # it ships no analysis_options.yaml of its own, so the analyzer walks up to
  # the root file and applies strict-casts/strict-inference/strict-raw-types to
  # a vendored upstream fork - 131 issues, 72 of them errors, none of which
  # stop it compiling. Its one test file is an on-device FFI test that fails on
  # a host machine (it asserts an int and gets a JSValue pointer back). Give it
  # a two-line analysis_options.yaml of its own and it can join this matrix.
  # Its native side is compiled by every leg of the build matrix below.
  packages:
    name: Package ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [flutter_torrent_server]
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock', 'packages/*/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Analyze & Test
        working-directory: packages/${{ matrix.package }}
        run: |
          flutter pub get
          # Same policy as the app job: warnings gate, infos do not.
          flutter analyze --no-fatal-infos
          # `flutter test` exits 1 on a package with no test/ directory, which
          # is a fact about the package rather than a failure - it turns this
          # job red on every run. The first test file added will make the
          # branch below run it.
          if [ -d test ]; then
            flutter test
          else
            echo "::notice::${{ matrix.package }} has no test/ directory; skipping."
          fi

  # Boots the app on a real engine with real plugins registered, on a real
  # device and a real simulator. The unit suite runs in a test binding where
  # none of the native side exists, so it cannot see a failure that stops the
  # app opening at all. Two shipped in 3.7.1 — libmpv.so.2 and
  # libicuuc.so.74 missing on Linux — and both passed analyze and the entire
  # unit suite. A test that never starts the app cannot catch an app that does
  # not start.
  #
  # Skipped on pull requests on purpose: an emulator boot plus a simulator
  # boot is minutes of wall clock on every PR, and a PR is a bad place to
  # discover a flaky device. Pushes to main and the nightly run cover it.
  smoke-mobile:
    name: Smoke Test ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-latest
          - name: iOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set Up JDK
        if: matrix.name == 'Android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock', 'packages/*/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Install Flutter Dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # The emulator needs a KVM node the runner user can open. Without this
      # the runner falls back to software rendering and the boot times out.
      - name: Enable KVM
        if: matrix.name == 'Android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke Test Android
        if: matrix.name == 'Android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Not the minSdk floor (build.gradle.kts inherits Flutter's), but a
          # current API level with a google_apis image: the point of this leg is
          # that the plugins register cleanly on a device people actually run.
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: flutter test --no-pub integration_test

      - name: Boot iOS Simulator
        if: matrix.name == 'iOS'
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; \
                print(next(d['udid'] for k in ds for d in ds[k] if 'iPhone' in d['name']))")"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Smoke Test iOS
        if: matrix.name == 'iOS'
        run: flutter test --no-pub integration_test -d "$SIM_UDID"

  # The Go source the TorrServer binaries and the Android .aar are built from.
  # Nothing else in this workflow compiles it, and `go test` is seconds.
  torrent-server-go:
    name: TorrServer (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/flutter_torrent_server/go_src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/flutter_torrent_server/go_src/go.mod
          cache-dependency-path: packages/flutter_torrent_server/go_src/go.sum

      # go_src vendors its dependencies, so both commands run offline.
      - name: Build
        run: go build ./...

      # `go test` runs a subset of `go vet` first. One check is dropped: the
      # vendored upstream web/api/utils/link.go:52 calls fmt.Errorf with
      # arguments and no format directives, which fails the `printf` analyser
      # and has done since the initial commit. Every other default vet check is
      # kept, so a newly introduced vet failure still turns this job red.
      - name: Test
        run: go test -vet=atomic,bool,buildtags,errorsas,ifaceassert,nilfunc,stringintconv,tests ./...

  # Decides how wide the build matrix below is. See the header comment.
  changes:
    name: Pick Build Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The diff needs the PR base commit, which a depth-1 checkout does
          # not have. blob:none keeps the trees `--name-only` walks without
          # fetching file contents, so this stays fast on a repo carrying
          # ~200 MB of prebuilt binaries.
          fetch-depth: 0
          filter: blob:none

      - name: Pick Build Matrix
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          ANDROID='{"name":"Android","os":"ubuntu-latest","build":"flutter build apk --debug"}'
          LINUX='{"name":"Linux","os":"ubuntu-latest","build":"flutter build linux --debug"}'
          WINDOWS='{"name":"Windows","os":"windows-latest","build":"flutter build windows --debug"}'
          MACOS='{"name":"macOS","os":"macos-latest","build":"flutter build macos --debug"}'
          IOS='{"name":"iOS","os":"macos-latest","build":"flutter build ios --debug --no-codesign"}'
          CORE="[$ANDROID,$LINUX]"
          FULL="[$ANDROID,$LINUX,$WINDOWS,$MACOS,$IOS]"

          if [ "$EVENT_NAME" != 'pull_request' ]; then
            echo "Event is $EVENT_NAME: building every shipping platform."
            echo "matrix=$FULL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Anything that can change what a native toolchain compiles or links.
          NATIVE='^(packages/|android/|ios/|macos/|windows/|linux/|pubspec\.(yaml|lock)$|\.github/workflows/ci\.yml$)'
          CHANGED="$(git diff --name-only "$BASE_SHA" HEAD)"
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -Eq "$NATIVE"; then
            echo "Native-relevant paths changed: building every shipping platform."
            echo "matrix=$FULL" >> "$GITHUB_OUTPUT"
          else
            echo "Dart-only change: Windows, macOS and iOS are left to the"
            echo "push-to-master and nightly runs."
            echo "matrix=$CORE" >> "$GITHUB_OUTPUT"
          fi

  # One debug build per shipping platform. Debug, and deliberately without
  # --dart-define-from-file: these jobs only have to prove the platform
  # toolchains still compile the tree, and fork pull requests cannot read
  # secrets.
  build:
    name: Build ${{ matrix.name }}
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    defaults:
      run:
        # Git bash on the Windows runner, so every leg reads the same.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # android/app/build.gradle.kts pins source/targetCompatibility to 17.
      # Pin the toolchain too rather than inherit whichever JDK the runner
      # image happens to default to this month.
      - name: Set Up JDK
        if: matrix.name == 'Android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Select Latest Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Same set the release workflow installs, which is the only evidence we
      # have that it is sufficient. libmpv-dev and libicu-dev are what the
      # vendored video_view plugin's CMakeLists.txt asks pkg-config for; the
      # release workflow got libicu-dev transitively, so naming it here makes
      # the dependency explicit rather than incidental.
      # package:jni is an FFI plugin here and looks for a JDK, but its CMake
      # falls through to an empty target when one is absent, so it needs no
      # apt package of its own.
      - name: Install Linux Dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev libicu-dev \
            libasound2-dev libsecret-1-dev

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          # Two paths because the Windows runner does not use ~/.pub-cache.
          path: |
            ~/.pub-cache
            ~/AppData/Local/Pub/Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock', 'packages/*/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      # Desktop support is on by default in this SDK, but the release workflow
      # sets it explicitly and a config default is not something to depend on.
      - name: Enable Desktop Targets
        run: flutter config --enable-linux-desktop --enable-macos-desktop --enable-windows-desktop

      - name: Install Flutter Dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # Mirrors the release workflow. A fresh checkout stages no desktop
      # TorrServer binary, so this has nothing to remove; it is here so an APK
      # stays small if that ever stops being true.
      - name: Strip Desktop TorrServer Binaries
        if: matrix.name == 'Android'
        run: rm -f packages/flutter_torrent_server/assets/torrserver/TorrServer-*

      - name: Build ${{ matrix.name }}
        run: ${{ matrix.build }}
