# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/logo-1.png"

  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/logo-1.png"

  ios: true
  remove_alpha_ios: true

  web:
    generate: false

  windows:
    generate: true
    image_path: "assets/images/logo-1.png"

  macos:
    generate: true
    image_path: "assets/images/logo-1.png"

  linux:
    generate: true
    image_path: "assets/images/logo-1.png"
