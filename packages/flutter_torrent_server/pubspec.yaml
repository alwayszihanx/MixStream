name: flutter_torrent_server
description: "A new Flutter plugin project."
version: 0.0.1
homepage:

environment:
  sdk: ^3.10.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.5
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: com.example.flutter_torrent_server
        pluginClass: FlutterTorrentServerPlugin
      ios:
        pluginClass: FlutterTorrentServerPlugin
      linux:
        dartPluginClass: FlutterTorrentServerDesktop
      macos:
        dartPluginClass: FlutterTorrentServerDesktop
      windows:
        dartPluginClass: FlutterTorrentServerDesktop

  # The desktop TorrServer executables are committed to desktop_binaries/,
  # which is NOT an asset directory, because all six together are ~100 MB and
  # Android runs TorrServer through the local AAR (libgojni.so) and never
  # touches them - committing them as assets put 100 MB in every APK.
  #
  # Desktop builds need exactly one of them, so the build workflows copy that
  # one into assets/torrserver/ before compiling; only what is staged gets
  # bundled. flutter_torrent_server_desktop.dart loads it from
  # rootBundle at packages/flutter_torrent_server/assets/torrserver/<name>,
  # which is why this declaration has to stay.
  #
  # assets/torrserver/ tracks a .gitkeep so the declared directory always
  # exists after a fresh clone. With nothing staged, the bundle is empty and
  # an Android build stays small; desktop builds that forget the staging step
  # will fail at runtime, not at build time - stage it.
  assets:
    - assets/torrserver/
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
